name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  catalog-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Lint (spotless)
        run: mvn -B -f catalog-service/pom.xml spotless:check
      - name: Build, unit and integration tests
        run: mvn -B -f catalog-service/pom.xml verify
      - name: Dependency vulnerability check
        run: mvn -B -f catalog-service/pom.xml org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7 -DnvdApiKey=${{ secrets.NVD_API_KEY }}

  order-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Lint (spotless)
        run: mvn -B -f order-service/pom.xml spotless:check
      - name: Build, unit and integration tests
        run: mvn -B -f order-service/pom.xml verify
      - name: Dependency vulnerability check
        run: mvn -B -f order-service/pom.xml org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7 -DnvdApiKey=${{ secrets.NVD_API_KEY }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Format check (prettier)
        run: npm run format:check
      - name: Unit tests (vitest)
        run: npm run test
      - name: Production build
        run: npm run build:prod

  docker-build:
    needs: [catalog-service, order-service, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build catalog-service image
        run: docker build ./catalog-service -t catalog-service:ci
      - name: Build order-service image
        run: docker build ./order-service -t order-service:ci
      - name: Build frontend image
        run: docker build ./frontend -t frontend:ci
