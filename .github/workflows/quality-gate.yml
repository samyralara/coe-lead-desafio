name: Quality Gate - QA

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-restassured:
    name: api-restassured
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            order-service/pom.xml
            catalog-service/pom.xml
            qa/api/pom.xml
      - name: Subir bancos e APIs reais
        run: docker compose up -d --build postgres mongo catalog-service order-service
      - name: Aguardar disponibilidade e validar serviços
        shell: bash
        run: |
          set -euo pipefail
          for service in 8080 8081; do
            ready=0
            for i in {1..90}; do
              if curl --silent --fail "http://127.0.0.1:${service}/actuator/health" >/dev/null; then ready=1; break; fi
              sleep 3
            done
            if [ "$ready" -ne 1 ]; then docker compose ps; docker compose logs --tail=150; exit 1; fi
          done
      - name: Testes de API com Rest-Assured
        working-directory: qa/api
        env:
          QA_ORDER_BASE_URL: http://127.0.0.1:8080
          QA_CATALOG_BASE_URL: http://127.0.0.1:8081
        run: mvn -B --no-transfer-progress clean test
      - name: Publicar relatório JUnit da API
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-junit-${{ github.run_id }}
          path: qa/api/target/surefire-reports/
          if-no-files-found: warn
      - name: Diagnóstico dos serviços (falhas)
        if: failure()
        run: docker compose logs --no-color --tail=250 > docker-compose-logs.txt
      - name: Publicar logs (falhas)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-service-logs-${{ github.run_id }}
          path: docker-compose-logs.txt
          if-no-files-found: ignore
      - name: Desligar ambiente
        if: always()
        run: docker compose down -v --remove-orphans

  ui-playwright:
    name: ui-playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            qa/ui/package-lock.json
      - name: Instalar dependências do Angular
        run: npm ci --prefix frontend
      - name: Instalar Playwright
        run: npm ci --prefix qa/ui
      - name: Instalar Chromium e bibliotecas
        working-directory: qa/ui
        run: npx playwright install --with-deps chromium
      - name: Typecheck da automação
        working-directory: qa/ui
        run: npm run typecheck
      - name: Build Angular (validação adicional)
        run: npm run build:prod --prefix frontend
      - name: Playwright isolado com mocks (sem E2E integrado)
        working-directory: qa/ui
        env:
          START_APP: '1'
          TEST_MODE: mock
          BASE_URL: http://127.0.0.1:4200
          CI: 'true'
        run: npx playwright test --grep-invert '@integrated'
      - name: Publicar relatórios do navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-${{ github.run_id }}
          path: |
            qa/ui/playwright-report/
            qa/ui/test-results/
          if-no-files-found: warn

  e2e-integrated:
    name: e2e-integrated
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            qa/ui/package-lock.json
      - name: Subir aplicação completa em Docker
        run: docker compose up -d --build postgres mongo catalog-service order-service frontend
      - name: Aguardar frontend e APIs
        shell: bash
        run: |
          set -euo pipefail
          for port in 4200 8080 8081; do
            ready=0
            for i in {1..90}; do
              if curl --silent --fail "http://127.0.0.1:${port}/" >/dev/null; then ready=1; break; fi
              if [ "$port" != 4200 ] && curl --silent --fail "http://127.0.0.1:${port}/actuator/health" >/dev/null; then ready=1; break; fi
              sleep 3
            done
            if [ "$ready" -ne 1 ]; then docker compose ps; docker compose logs --tail=150; exit 1; fi
          done
      - name: Instalar Playwright
        run: npm ci --prefix qa/ui
      - name: Instalar Chromium
        working-directory: qa/ui
        run: npx playwright install --with-deps chromium
      - name: Jornada integrada (sem mocks)
        working-directory: qa/ui
        env:
          START_APP: '0'
          TEST_MODE: integrated
          BASE_URL: http://127.0.0.1:4200
          CI: 'true'
        run: npx playwright test --grep '@integrated'
      - name: Publicar evidências E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-${{ github.run_id }}
          path: |
            qa/ui/playwright-report/
            qa/ui/test-results/
          if-no-files-found: warn
      - name: Diagnóstico E2E
        if: failure()
        run: docker compose logs --no-color --tail=250 > docker-compose-logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-service-logs-${{ github.run_id }}
          path: docker-compose-logs.txt
          if-no-files-found: ignore
      - name: Desligar ambiente
        if: always()
        run: docker compose down -v --remove-orphans

  quality-gate:
    name: quality-gate
    if: always()
    needs: [api-restassured, ui-playwright, e2e-integrated]
    runs-on: ubuntu-latest
    steps:
      - name: Exigir todas as suítes com sucesso
        env:
          API: ${{ needs.api-restassured.result }}
          UI: ${{ needs.ui-playwright.result }}
          E2E: ${{ needs.e2e-integrated.result }}
        shell: bash
        run: |
          echo "API=$API UI=$UI E2E=$E2E"
          test "$API" = success
          test "$UI" = success
          test "$E2E" = success
